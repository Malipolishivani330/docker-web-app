name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docker-web-app .

      - name: Run Docker container
        run: docker run -d -p 8080:80 --name docker-web-container docker-web-app

      - name: Wait for application
        run: sleep 10

      - name: Check container status
        run: docker ps -a

      - name: Check container logs
        run: docker logs docker-web-container

      - name: Verify application
        run: curl --fail --retry 5 --retry-delay 2 http://localhost:8080